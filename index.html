  <title>Tina Build Coach - Student Project Studio</title>
  
  <!-- React, Tailwind, and Supabase -->

  <style>

    body [class~="bg-slate-800/60"] { background-color: #c9e6efb8; }
    body [class~="bg-slate-700"] { background-color: #d7e7d0; }
    body [class~="bg-emerald-950"] { background-color: #dcebd7; }
    body [class~="bg-emerald-950/60"] { background-color: #286c3b; }
    body [class~="bg-emerald-400"] { background-color: var(--green); }
    body [class~="bg-emerald-300"] { background-color: var(--green-hover); }
    body [class~="bg-emerald-700"] { background-color: #286c3b; }
    body [class~="bg-amber-950/60"] { background-color: #fff5df; }
    body [class~="border-slate-800"] { border-color: var(--line); }
    body [class~="border-slate-700"], body [class~="border-slate-600"] { border-color: #b8ceb9; }
    body [class~="border-emerald-900"] { border-color: #b7d4ae; }
    body [class~="border-amber-900"] { border-color: #ead7ad; }
    body [class~="text-white"] { color: var(--ink); }
    body [class~="text-slate-100"] { color: #1c3325; }
    body [class~="text-slate-200"] { color: #243d2d; }
    body [class~="text-slate-300"] { color: #2d4835; }
    body [class~="text-slate-400"] { color: #344f3b; }
    body [class~="text-slate-500"] { color: #3d5943; }
    body [class~="text-slate-950"] { color: #ffffff; }
    body [class~="text-emerald-400"], body [class~="text-emerald-300"] { color: #194c2b; }
    body [class~="text-emerald-200"] { color: #214f2d; }
    body [class~="text-emerald-100"] { color: #315437; }

    body [class~="bg-emerald-700"].text-white { color: #ffffff; }
    body [class~="bg-slate-700"]:hover { background-color: #c9dfc2; }

    button, summary { transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease; }
    button:not(:disabled):active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid #49a564; outline-offset: 2px; }
    .garden-sweep { position: relative; isolation: isolate; overflow: hidden; }
    .garden-sweep::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      background: var(--green-hover);
      content: "";
      transform: translateY(101%);
      transition: transform 260ms cubic-bezier(.2,.7,.2,1);
    }
    .garden-sweep:hover::before, .garden-sweep:focus-visible::before { transform: translateY(0); }
    body .garden-sweep:hover, body .garden-sweep:focus-visible { color: #ffffff; border-color: var(--green); }
    .garden-sweep > span { position: relative; z-index: 1; }
    .garden-nav-icon {
      position: relative;
      display: inline-grid;
      width: 1.75rem;
      height: 1.75rem;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border-radius: 9999px;
      background: #d1e5cf;
      color: #214f2d;
      perspective: 240px;
    }
    .garden-nav-icon::before {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--green);
      content: "";
      transform: translateY(101%);
      transition: transform 260ms cubic-bezier(.2,.7,.2,1);
    }
    .garden-icon-glyph { position: relative; transition: transform 520ms cubic-bezier(.2,.7,.2,1); }
    .garden-sweep:hover .garden-nav-icon::before, .garden-sweep:focus-visible .garden-nav-icon::before { transform: translateY(0); }
    .garden-sweep:hover .garden-icon-glyph, .garden-sweep:focus-visible .garden-icon-glyph { color: #ffffff; transform: rotateY(360deg); }
    @media (prefers-reduced-motion: reduce) {
      .garden-sweep::before, .garden-nav-icon::before, .garden-icon-glyph { transition: none; }
    }
    .app-shell {
      background:
        radial-gradient(ellipse at 12% 100%, rgb(159 202 78 / 24%), transparent 40%),
        radial-gradient(ellipse at 88% 0%, rgb(103 177 204 / 24%), transparent 42%),
        linear-gradient(145deg, #d2e9ee 0%, #e8efdc 54%, #d5e5d0 100%);
    }
    .app-shell main > header, .app-shell main > nav[aria-label="Project sections"] {
      background: linear-gradient(90deg, #c8e3e9 0%, #e2ebcf 100%);
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans">
  <div id="root"></div>

  <!-- ESM Transformers.js Module Setup -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
    env.allowLocalModels = true;
    env.allowRemoteModels = false;
    env.localModelPath = "./";
    window.hfPipeline = pipeline;
    window.loadPdfJs = async () => {
      if (!window.pdfjsLib) {
        window.pdfjsLib = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
      }
      return window.pdfjsLib;
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const extractProjectBrief = async (file) => {
      if (file.size > 8 * 1024 * 1024) {
        throw new Error("Please choose a file smaller than 8 MB.");
      }

      const extension = file.name.split(".").pop().toLowerCase();
      let text = "";
      if (extension === "txt" || extension === "md") {
        text = await file.text();
      } else if (extension === "docx") {
        if (!window.mammoth) throw new Error("The DOCX reader did not load. Try a PDF or text file.");
        const result = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
        text = result.value;
      } else if (extension === "pdf") {
        const pdfjsLib = await window.loadPdfJs();
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        const pages = [];
        for (let pageNumber = 1; pageNumber <= Math.min(pdf.numPages, 30); pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const content = await page.getTextContent();
          pages.push(content.items.map(item => item.str).join(" "));
        }
        text = pages.join("\n");
      } else {
        throw new Error("Use a PDF, DOCX, TXT, or Markdown project brief.");
      }

      const cleanText = text.replace(/\0/g, "").trim();
      if (!cleanText) throw new Error("No readable text found. Scanned PDFs need OCR before upload.");
      return cleanText.slice(0, 12000);
    };

    // The ONNX model is stored beside this HTML file in the Space repository.
    const TINA_MODEL_ID = "tina-onnx-model";
    const SUPABASE_URL = "https://ixntxgqaggkaaekewazu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7SZ_z5FKbA77vZ04rnJKGQ_zXssCIT0";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const DEMO_STORAGE_KEY = "tina-build-coach-demo-v1";

    const createDemoWorkspace = () => {
      const now = new Date().toISOString();
      return {
        projects: [{
          id: "demo-project-library",
          owner_id: "demo-user",
          title: "Campus Library Borrowing System",
          summary: "Demo brief: A web app for students to search library books, check availability, and request a loan. Librarians need to manage the catalog and approve or reject requests. The student team is still deciding how overdue returns should be handled.",
          tech_stack: ["React", "Supabase", "PostgreSQL"],
          created_at: now,
          updated_at: now
        }],
        requirements: [{
          id: "demo-requirement-search",
          project_id: "demo-project-library",
          description: "Students can search the catalog and see whether a book is available.",
          status: "in_progress",
          evidence: "",
          created_at: now,
          updated_at: now
        }],
        milestones: [{
          id: "demo-milestone-prototype",
          project_id: "demo-project-library",
          title: "Build the catalog search prototype",
          details: "",
          due_date: null,
          status: "not_started",
          position: 0,
          created_at: now,
          updated_at: now
        }],
        messages: [{
          id: "demo-message-welcome",
          project_id: "demo-project-library",
          role: "assistant",
          content: "Welcome to the demo project. I have the library-system brief, stack, one requirement, and a milestone. Ask me what to build next, or try a mock defense question.",
          created_at: now
        }]
      };
    };

    const readDemoWorkspace = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(DEMO_STORAGE_KEY));
        if (saved && Array.isArray(saved.projects) && Array.isArray(saved.requirements) && Array.isArray(saved.milestones) && Array.isArray(saved.messages)) {
          return saved;
        }
      } catch (error) {
        console.warn("Could not read the saved demo workspace.", error);
      }
      const workspace = createDemoWorkspace();
      localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify(workspace));
      return workspace;
    };

    const updateDemoWorkspace = (update) => {
      const workspace = readDemoWorkspace();
      update(workspace);
      localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify(workspace));
      return workspace;
    };

    const createDemoId = () => `demo-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

    function App() {
      const [user, setUser] = useState(null);
      const [demoMode, setDemoMode] = useState(false);
      const [authMode, setAuthMode] = useState("sign_in");
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [authNotice, setAuthNotice] = useState("");
      const [authBusy, setAuthBusy] = useState(false);
      useEffect(() => {
        setShowPassword(false);
      }, [authMode]);
      const [projects, setProjects] = useState([]);
      const [activeProject, setActiveProject] = useState(null);
      const [activeSection, setActiveSection] = useState("overview");
      const [requirements, setRequirements] = useState([]);
      const [milestones, setMilestones] = useState([]);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [status, setStatus] = useState("Ready");
      const [notice, setNotice] = useState("");
      const [projectTitle, setProjectTitle] = useState("");
      const [projectSummary, setProjectSummary] = useState("");
      const [projectNotes, setProjectNotes] = useState("");
      const [projectStack, setProjectStack] = useState("");
      const [briefFileName, setBriefFileName] = useState("");
      const [briefStatus, setBriefStatus] = useState("");
      const [requirementDraft, setRequirementDraft] = useState("");
      const [milestoneDraft, setMilestoneDraft] = useState("");
      const [startDateDraft, setStartDateDraft] = useState("");
      const [dueDateDraft, setDueDateDraft] = useState("");
      const [ganttPreferences, setGanttPreferences] = useState(() => window.GanttTools.readPreferences());
      const [ganttExporting, setGanttExporting] = useState(false);
      const [ganttExportNotice, setGanttExportNotice] = useState("");
      const [loading, setLoading] = useState(false);
      const [savingProject, setSavingProject] = useState(false);
      const pipelinesRef = useRef({ generate: null });
      const chatEndRef = useRef(null);

      const getPipeline = async () => {
        if (!window.hfPipeline) {
          throw new Error("Tina is still loading. Wait a moment and try again.");
        }
        if (!pipelinesRef.current.generate) {
          pipelinesRef.current.generate = await window.hfPipeline("text-generation", TINA_MODEL_ID);
        }
        return pipelinesRef.current.generate;
      };

      const openProject = async (project) => {
        setActiveProject(project);
        setActiveSection("overview");
        setMessages([]);
        setNotice("");
        setStatus("Loading project...");

        if (demoMode) {
          const workspace = readDemoWorkspace();
          setRequirements(workspace.requirements.filter(item => item.project_id === project.id));
          setMilestones(workspace.milestones.filter(item => item.project_id === project.id));
          setMessages(workspace.messages.filter(item => item.project_id === project.id).map(message => ({
            id: message.id,
            sender: message.role === "assistant" ? "bot" : "user",
            text: message.content
          })));
          setStatus("Demo workspace ready");
          return;
        }

        const [requirementsResult, milestonesResult, messagesResult] = await Promise.all([
          supabase.from("project_requirements").select("*").eq("project_id", project.id).order("created_at"),
          supabase.from("project_milestones").select("*").eq("project_id", project.id).order("position"),
          supabase.from("project_messages").select("*").eq("project_id", project.id).order("created_at")
        ]);
        const failedResult = [requirementsResult, milestonesResult, messagesResult].find(result => result.error);
        if (failedResult) {
          setStatus("Could not load project");
          setNotice(failedResult.error.message);
          return;
        }

        setRequirements(requirementsResult.data || []);
        setMilestones(milestonesResult.data || []);
        setMessages((messagesResult.data || []).map(message => ({
          id: message.id,
          sender: message.role === "assistant" ? "bot" : "user",
          text: message.content
        })));
        setStatus("Project ready");
      };

      useEffect(() => {
        let mounted = true;
        supabase.auth.getSession().then(({ data, error }) => {
          if (!mounted) return;
          if (error) setAuthNotice(error.message);
          setUser(data.session?.user || null);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user || null);
          setAuthNotice("");
        });
        return () => {
          mounted = false;
          subscription.unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!user) {
          setProjects([]);
          setActiveProject(null);
          setRequirements([]);
          setMilestones([]);
          setMessages([]);
          return;
        }

        if (demoMode) {
          const workspace = readDemoWorkspace();
          setProjects(workspace.projects);
          if (workspace.projects.length) {
            openProject(workspace.projects[0]);
          } else {
            setActiveProject(null);
            setStatus("Create your first demo project");
          }
          return;
        }

        let current = true;
        setStatus("Loading your projects...");
        supabase.from("student_projects").select("*").order("updated_at", { ascending: false })
          .then(async ({ data, error }) => {
            if (!current) return;
            if (error) {
              setStatus("Could not load projects");
              setNotice(error.message);
              return;
            }
            const loadedProjects = data || [];
            setProjects(loadedProjects);
            if (loadedProjects.length) {
              await openProject(loadedProjects[0]);
            } else {
              setActiveProject(null);
              setStatus("Create your first project");
            }
          });
        return () => { current = false; };
      }, [user, demoMode]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      const handleAuth = async (event) => {
        event.preventDefault();
        setAuthBusy(true);
        setAuthNotice("");
        try {
          const credentials = { email: authEmail.trim(), password: authPassword };
          const result = authMode === "sign_up"
            ? await supabase.auth.signUp(credentials)
            : await supabase.auth.signInWithPassword(credentials);
          if (result.error) throw result.error;
          if (authMode === "sign_up" && !result.data.session) {
            setAuthNotice("Check your email to confirm your account, then sign in.");
          } else {
            setAuthNotice(authMode === "sign_up" ? "Account created." : "Signed in.");
          }
        } catch (error) {
          setAuthNotice(error.message);
        } finally {
          setAuthBusy(false);
        }
      };

      const handleSignOut = async () => {
        if (demoMode) {
          setDemoMode(false);
          setUser(null);
          setActiveProject(null);
          setNotice("");
          return;
        }
        const { error } = await supabase.auth.signOut();
        if (error) setNotice(error.message);
      };

      const startDemo = () => {
        try {
          readDemoWorkspace();
          setDemoMode(true);
          setUser({ id: "demo-user", email: "Demo account (local only)" });
          setNotice("");
        } catch (error) {
          setAuthNotice(`Could not start the local demo: ${error.message}`);
        }
      };

      const handleBriefUpload = async (event) => {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        setBriefStatus("Reading your brief...");
        setNotice("");
        try {
          const extractedText = await extractProjectBrief(file);
          setProjectSummary(extractedText);
          setBriefFileName(file.name);
          setProjectTitle(current => current.trim() || file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " "));
          setBriefStatus(`Brief ready. Tina will use up to ${extractedText.length.toLocaleString()} characters as project memory.`);
        } catch (error) {
          setBriefStatus("");
          setNotice(error.message);
        }
      };

      const handleCreateProject = async (event) => {
        event.preventDefault();
        if (!projectTitle.trim()) return;
        setSavingProject(true);
        setNotice("");
        if (demoMode) {
          const now = new Date().toISOString();
          const project = {
            id: createDemoId(),
            owner_id: "demo-user",
            title: projectTitle.trim(),
            summary: [
              briefFileName ? `Source document: ${briefFileName}` : "",
              projectSummary.trim(),
              projectNotes.trim() ? `Student notes:\n${projectNotes.trim()}` : ""
            ].filter(Boolean).join("\n\n"),
            tech_stack: projectStack.split(",").map(item => item.trim()).filter(Boolean),
            created_at: now,
            updated_at: now
          };
          updateDemoWorkspace(workspace => workspace.projects.unshift(project));
          setSavingProject(false);
          setProjects(previous => [project, ...previous]);
          setProjectTitle("");
          setProjectSummary("");
          setProjectNotes("");
          setProjectStack("");
          setBriefFileName("");
          setBriefStatus("");
          await openProject(project);
          return;
        }
        const { data, error } = await supabase.from("student_projects").insert({
          owner_id: user.id,
          title: projectTitle.trim(),
          summary: [
            briefFileName ? `Source document: ${briefFileName}` : "",
            projectSummary.trim(),
            projectNotes.trim() ? `Student notes:\n${projectNotes.trim()}` : ""
          ].filter(Boolean).join("\n\n"),
          tech_stack: projectStack.split(",").map(item => item.trim()).filter(Boolean)
        }).select().single();
        setSavingProject(false);
        if (error) {
          setNotice(error.message);
          return;
        }
        setProjects(previous => [data, ...previous]);
        setProjectTitle("");
        setProjectSummary("");
        setProjectNotes("");
        setProjectStack("");
        setBriefFileName("");
        setBriefStatus("");
        await openProject(data);
      };

      const addRequirement = async (event) => {
        event.preventDefault();
        if (!requirementDraft.trim() || !activeProject) return;
        if (demoMode) {
          const now = new Date().toISOString();
          const requirement = {
            id: createDemoId(), project_id: activeProject.id, description: requirementDraft.trim(),
            status: "not_started", evidence: "", created_at: now, updated_at: now
          };
          updateDemoWorkspace(workspace => workspace.requirements.push(requirement));
          setRequirements(previous => [...previous, requirement]);
          setRequirementDraft("");
          return;
        }
        const { data, error } = await supabase.from("project_requirements").insert({
          project_id: activeProject.id,
          description: requirementDraft.trim()
        }).select().single();
        if (error) {
          setNotice(error.message);
          return;
        }
        setRequirements(previous => [...previous, data]);
        setRequirementDraft("");
      };

      const updateRequirementStatus = async (requirement, statusValue) => {
        if (demoMode) {
          const now = new Date().toISOString();
          updateDemoWorkspace(workspace => {
            workspace.requirements = workspace.requirements.map(item => item.id === requirement.id
              ? { ...item, status: statusValue, updated_at: now }
              : item);
          });
          setRequirements(previous => previous.map(item => item.id === requirement.id
            ? { ...item, status: statusValue, updated_at: now }
            : item));
          return;
        }
        const { data, error } = await supabase.from("project_requirements")
          .update({ status: statusValue }).eq("id", requirement.id).select().single();
        if (error) {
          setNotice(error.message);
          return;
        }
        setRequirements(previous => previous.map(item => item.id === data.id ? data : item));
      };

      const addMilestone = async (event) => {
        event.preventDefault();
        if (!milestoneDraft.trim() || !activeProject) return;
        if (!startDateDraft || !dueDateDraft || startDateDraft > dueDateDraft) {
          setNotice("Choose a start date and finish date, with the finish on or after the start.");
          return;
        }
        if (demoMode) {
          const now = new Date().toISOString();
          const milestone = {
            id: createDemoId(), project_id: activeProject.id, title: milestoneDraft.trim(), details: "",
            start_date: startDateDraft, due_date: dueDateDraft, status: "not_started", position: milestones.length,
            created_at: now, updated_at: now
          };
          updateDemoWorkspace(workspace => workspace.milestones.push(milestone));
          setMilestones(previous => [...previous, milestone]);
          setMilestoneDraft("");
          setStartDateDraft("");
          setDueDateDraft("");
          return;
        }
        const { data, error } = await supabase.from("project_milestones").insert({
          project_id: activeProject.id,
          title: milestoneDraft.trim(),
          start_date: startDateDraft,
          due_date: dueDateDraft,
          position: milestones.length
        }).select().single();
        if (error) {
          setNotice(error.message);
          return;
        }
        setMilestones(previous => [...previous, data]);
        setMilestoneDraft("");
        setStartDateDraft("");
        setDueDateDraft("");
      };

      const updateMilestoneSchedule = async (event, milestone) => {
        event.preventDefault();

          setMilestones(previous => previous.map(item => item.id === milestone.id

          return;

          } else {
            const { data, error } = await supabase.from("project_messages")
              .insert({ project_id: activeProject.id, role: "user", content: userQuery })
              .select().single();
            if (error) throw error;
            savedUserMessage = data;

          const userMessage = { id: savedUserMessage.id, sender: "user", text: savedUserMessage.content };

            do_sample: true,
            return_full_text: false

            sender: "bot",
            text: savedAssistantMessage.content

                  <div><p className="text-xs font-semibold uppercase tracking-widest text-emerald-400">Project planning</p><h2 className="mt-2 text-2xl font-semibold text-white">Build plan</h2><p className="mt-2 text-sm text-slate-400">Add activities and dates. Your Gantt timeline and milestone list update automatically.</p></div>
                  <section className="gantt-chart rounded-md border border-slate-800 p-4 md:p-5" data-template={ganttPreferences.template} style={{ "--gantt-accent": ganttPreferences.color }}>
                    <div className="flex flex-wrap items-end justify-between gap-4"><div><h3 className="font-semibold">Gantt timeline</h3><p className="mt-1 text-xs" style={{ color: "var(--gantt-muted)" }}>{scheduledMilestones.length} of {milestones.length} activities scheduled</p></div><div className="flex flex-wrap items-end gap-2">
                      <label className="grid gap-1 text-xs font-medium">Template<select aria-label="Gantt chart template" value={ganttPreferences.template} onChange={event => updateGanttPreference("template", event.target.value)} className="rounded border border-slate-700 bg-slate-900 px-2 py-2 text-xs text-slate-300">{Object.entries(window.GanttTools.templates).map(([value, template]) => <option key={value} value={value}>{template.label}</option>)}</select></label>
                      <label className="grid gap-1 text-xs font-medium">Bar color<input aria-label="Gantt bar color" type="color" value={ganttPreferences.color} onChange={event => updateGanttPreference("color", event.target.value)} className="h-9 w-12 cursor-pointer rounded border border-slate-700 bg-slate-900 p-1" /></label>
                      <button type="button" className="gantt-download rounded bg-slate-700 px-3 py-2 text-xs font-semibold text-slate-950 hover:bg-slate-600" disabled={!scheduledMilestones.length || ganttExporting} onClick={() => downloadGantt("svg")}>Download SVG</button>
                      <button type="button" className="gantt-download rounded bg-slate-700 px-3 py-2 text-xs font-semibold text-slate-950 hover:bg-slate-600" disabled={!scheduledMilestones.length || ganttExporting} onClick={() => downloadGantt("png")}>Download PNG</button>
                    </div></div>
                    {ganttExportNotice && <p role="status" className="mt-3 text-xs" style={{ color: "var(--gantt-muted)" }}>{ganttExportNotice}</p>}
                    {scheduledMilestones.length ? <div role="img" aria-label={`Gantt timeline for ${scheduledMilestones.length} scheduled activities`} className="mt-5 space-y-3">
                      <div className="grid grid-cols-[minmax(90px,0.8fr)_minmax(0,1.6fr)] items-end gap-3 border-b border-slate-800 pb-2"><span className="text-xs font-medium">Activity</span><div className="relative h-5">{timelineTicks.map(tick => <span key={tick.date} className="absolute top-0 whitespace-nowrap text-[10px]" style={{ color: "var(--gantt-muted)", left: `${tick.position}%`, transform: tick.position === 100 ? "translateX(-100%)" : tick.position === 0 ? "none" : "translateX(-50%)" }}>{formatPlanDate(tick.date)}</span>)}</div></div>
                      {scheduledMilestones.map(milestone => <div key={milestone.id} className="grid grid-cols-[minmax(90px,0.8fr)_minmax(0,1.6fr)] items-center gap-3"><span className="truncate text-xs font-medium" style={{ color: "var(--gantt-ink)" }} title={milestone.title}>{milestone.title}</span><div className="gantt-track"><span className="gantt-bar" style={{ left: `${milestone.left}%`, width: `${milestone.width}%` }} title={`${milestone.title}: ${formatPlanDate(milestone.start_date)} to ${formatPlanDate(milestone.due_date)}`} /></div></div>)}
                    </div> : <div className="mt-5 rounded border border-dashed border-slate-700 px-4 py-6 text-center"><p className="text-sm font-medium">Your timeline will appear here</p><p className="mt-1 text-xs" style={{ color: "var(--gantt-muted)" }}>Add an activity with start and finish dates to generate the chart.</p></div>}
                  </section>
                  <section className="border-t border-slate-800 pt-5">
                    <div className="flex flex-wrap items-center justify-between gap-3"><div><h3 className="font-semibold text-white">Activities & milestones</h3><p className="mt-1 text-xs text-slate-500">Each activity becomes a milestone on your project timeline.</p></div><span className="text-xs text-slate-400">{milestones.filter(item => item.status === "done").length}/{milestones.length} complete</span></div>
                    <form onSubmit={addMilestone} className="mt-4 grid gap-2 sm:grid-cols-[minmax(0,1fr)_auto_auto_auto]"><input required value={milestoneDraft} onChange={event => setMilestoneDraft(event.target.value)} maxLength="200" placeholder="Activity, e.g. Interview users" aria-label="Activity name" className="min-w-0 rounded border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white outline-none focus:border-emerald-500" /><input required aria-label="Activity start date" type="date" max={dueDateDraft || undefined} value={startDateDraft} onChange={event => setStartDateDraft(event.target.value)} className="min-w-0 rounded border border-slate-700 bg-slate-900 px-2 py-2 text-xs text-slate-300" /><input required aria-label="Activity finish date" type="date" min={startDateDraft || undefined} value={dueDateDraft} onChange={event => setDueDateDraft(event.target.value)} className="min-w-0 rounded border border-slate-700 bg-slate-900 px-2 py-2 text-xs text-slate-300" /><button className="rounded bg-emerald-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-300">Add activity</button></form>
                    <div className="mt-3 space-y-2">{milestones.map(milestone => <div key={milestone.id} className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 py-3"><div className="min-w-0 flex-1"><p className="text-sm text-slate-200">{milestone.title}</p><p className="mt-1 text-xs text-slate-500">{milestone.start_date && milestone.due_date ? `${formatPlanDate(milestone.start_date)} - ${formatPlanDate(milestone.due_date)}` : milestone.due_date ? `Finish ${formatPlanDate(milestone.due_date)} · start date not set` : "Dates not set"}</p><details className="mt-1"><summary className="cursor-pointer text-xs font-medium text-emerald-300">{milestone.start_date && milestone.due_date ? "Edit dates" : "Set dates"}</summary><form onSubmit={event => updateMilestoneSchedule(event, milestone)} className="mt-2 grid gap-2 sm:grid-cols-[auto_auto_auto]"><input required name="start_date" aria-label={`Start date for ${milestone.title}`} type="date" defaultValue={milestone.start_date || ""} className="min-w-0 rounded border border-slate-700 bg-slate-900 px-2 py-2 text-xs text-slate-300" /><input required name="due_date" aria-label={`Finish date for ${milestone.title}`} type="date" defaultValue={milestone.due_date || ""} className="min-w-0 rounded border border-slate-700 bg-slate-900 px-2 py-2 text-xs text-slate-300" /><button className="w-fit rounded bg-slate-700 px-3 py-2 text-xs font-semibold text-slate-950 hover:bg-slate-600">Save dates</button></form></details></div><StatusSelect value={milestone.status} onChange={value => updateMilestoneStatus(milestone, value)} /></div>)}{!milestones.length && <p className="py-2 text-sm text-slate-500">Add your first activity to create a timeline.</p>}</div>
                  </section>
                  <section className="border-t border-slate-800 pt-5">
                    <div className="flex items-center justify-between gap-3"><h3 className="font-semibold text-white">Requirements</h3><span className="text-xs text-slate-400">{requirements.filter(item => item.status === "done").length}/{requirements.length} complete</span></div>
                    <form onSubmit={addRequirement} className="mt-4 flex gap-2"><input value={requirementDraft} onChange={event => setRequirementDraft(event.target.value)} maxLength="4000" placeholder="Add a requirement" className="min-w-0 flex-1 rounded border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white outline-none focus:border-emerald-500" /><button className="rounded bg-slate-700 px-3 py-2 text-sm text-white hover:bg-slate-600">Add</button></form>
                    <div className="mt-3 space-y-2">{requirements.map(requirement => <div key={requirement.id} className="flex items-start justify-between gap-3 border-b border-slate-800 py-3"><p className="text-sm leading-5 text-slate-300">{requirement.description}</p><StatusSelect value={requirement.status} onChange={value => updateRequirementStatus(requirement, value)} /></div>)}{!requirements.length && <p className="py-2 text-sm text-slate-500">Add a requirement to start your traceability checklist.</p>}</div>
                  </section>
                </section>}

                {activeSection === "coach" && <section className="flex h-full min-h-0 flex-col">
                  <div className="border-b border-slate-800 px-5 py-4"><div className="mx-auto flex max-w-5xl items-center gap-4"><button type="button" onClick={() => setActiveSection("overview")} aria-label="Back to project overview" title="Back to project overview" className="garden-sweep flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-slate-700 bg-slate-900 text-lg text-slate-300 hover:border-emerald-400 hover:text-emerald-300"><span className="garden-icon-glyph" aria-hidden="true">&#8592;</span></button><div className="min-w-0"><p className="text-xs font-semibold uppercase tracking-widest text-emerald-400">Project conversation</p><h2 className="truncate font-semibold text-white">{activeProject.title}</h2></div></div></div>
                  {notice && <div role="alert" className="border-b border-amber-900 bg-amber-950/60 px-5 py-2 text-sm text-amber-200">{notice}</div>}
                  <div className="flex flex-wrap gap-2 border-b border-slate-800 px-5 py-3"><div className="mx-auto flex w-full max-w-5xl flex-wrap gap-2">
                    {[["Next step", "What should I build next for this project?"], ["Spot risks", "What are the biggest risks or unknowns in this project?"], ["Practice defense", "Ask me one mock project defense question."]].map(([label, prompt]) => <button key={label} type="button" disabled={loading} onClick={event => handleSend(event, prompt)} className="rounded-full border border-slate-700 bg-slate-900 px-3 py-1.5 text-xs font-medium text-slate-300 hover:border-emerald-400 hover:text-emerald-300 disabled:opacity-50">{label}</button>)}
                  </div></div>
                  <div className="min-h-0 flex-1 overflow-y-auto px-5 py-5"><div className="mx-auto w-full max-w-5xl space-y-4">
                    {!messages.length && <div className="max-w-md"><p className="text-sm font-medium text-white">{activeProject.summary ? "Your Project Twin is ready to build." : "Start with your next decision."}</p><p className="mt-2 text-sm leading-5 text-slate-400">{activeProject.summary ? "Tina can map the brief into goals, requirements, risks, and the one thing you should clarify next." : "Tell Tina what you are building in your own words. No setup checklist required."}</p>{activeProject.summary && <button onClick={() => handleSend(null, "Read my saved project brief and create my Project Twin. Summarize the goal, target users, stated requirements, technologies, risks, and assumptions. Separate facts from guesses, then ask only the single most important question the brief leaves unanswered.")} className="mt-4 rounded bg-emerald-400 px-3 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-300">Analyze my brief</button>}</div>}
                    {messages.map((message, index) => <div key={message.id || index} className={`flex ${message.sender === "user" ? "justify-end" : "justify-start"}`}><div className={`max-w-[90%] whitespace-pre-wrap rounded-md px-4 py-3 text-sm leading-6 ${message.sender === "user" ? "bg-emerald-700 text-white" : "border border-slate-800 bg-slate-900 text-slate-200"}`}><p className="mb-1 text-[10px] font-semibold uppercase tracking-widest opacity-60">{message.sender === "user" ? "You" : "Tina"}</p>{message.text}</div></div>)}
                    {loading && <p className="text-xs text-emerald-300">Tina is working through the project context...</p>}<div ref={chatEndRef} />
                  </div></div>
                  <form onSubmit={handleSend} className="border-t border-slate-800 bg-slate-900 p-4"><div className="mx-auto w-full max-w-5xl"><textarea rows="2" value={input} onChange={event => setInput(event.target.value)} onKeyDown={event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); event.currentTarget.form.requestSubmit(); } }} placeholder="Ask about your project, requirements, or next step..." className="w-full resize-y rounded border border-slate-700 bg-slate-950 px-3 py-3 text-sm text-white outline-none focus:border-emerald-500" /><div className="mt-2 flex items-center justify-between gap-3"><span className="text-xs text-slate-500">Enter to send, Shift+Enter for a new line</span><button disabled={loading || !input.trim()} className="rounded bg-emerald-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-300 disabled:opacity-50">Send to Tina</button></div></div></form>
                </section>}
              </div>
            )}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
