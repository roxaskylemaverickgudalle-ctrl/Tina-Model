    .demo-dismiss-button { border-radius: 9999px; color: #52615a; }
    .demo-dismiss-button:hover { color: #8c3131; background: #f9e9e7; }
    .garden-sweep { position: relative; isolation: isolate; overflow: hidden; }
    .garden-sweep::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      background: var(--green-hover);
      content: "";
      transform: translateY(101%);
      transition: transform 260ms cubic-bezier(.2,.7,.2,1);
    }
    .garden-sweep:hover::before, .garden-sweep:focus-visible::before { transform: translateY(0); }

    .garden-sweep > span { position: relative; z-index: 1; }
    .garden-nav-icon {
      position: relative;
      display: inline-grid;
      width: 1.75rem;
      height: 1.75rem;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border-radius: 9999px;
      background: #d1e5cf;
      color: #214f2d;
      perspective: 240px;
    }
    .garden-nav-icon::before {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--green);
      content: "";
      transform: translateY(101%);
      transition: transform 260ms cubic-bezier(.2,.7,.2,1);
    }

    .garden-sweep:hover .garden-icon-glyph, .garden-sweep:focus-visible .garden-icon-glyph { color: #ffffff; transform: rotateY(360deg); }
    .project-list-nav { overflow-x: hidden; overflow-y: auto; padding: 0 .75rem 1rem; }
    .project-list-link {
      position: relative;
      z-index: 0;
      display: flex;
      width: 100%;
      align-items: center;
      gap: .75rem;
      overflow: visible;
      border: 1px solid transparent;
      border-radius: .6rem;
      padding: .75rem;
      color: #344f3b;
      isolation: isolate;
      text-align: left;
      transition: width 260ms cubic-bezier(.2,.7,.2,1), transform 260ms cubic-bezier(.2,.7,.2,1), border-color 180ms ease, color 180ms ease;
    }
    .project-list-link::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(112deg, #236b39 0%, #398e50 52%, #83aa46 100%);

      opacity: 0;
      transform: scaleX(.86);
      transform-origin: left center;
      transition: opacity 200ms ease, transform 280ms cubic-bezier(.2,.7,.2,1);

  <!-- ESM Transformers.js Module Setup -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
    env.allowLocalModels = true;
    env.allowRemoteModels = false;
    env.localModelPath = "./";
    window.hfPipeline = pipeline;
    window.loadPdfJs = async () => {
      if (!window.pdfjsLib) {
        window.pdfjsLib = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');

    const extractProjectBrief = async (file) => {
      if (file.size > 8 * 1024 * 1024) {
        throw new Error("Please choose a file smaller than 8 MB.");
      }

      const extension = file.name.split(".").pop().toLowerCase();
      let text = "";
      if (extension === "txt" || extension === "md") {
        text = await file.text();
      } else if (extension === "docx") {
        if (!window.mammoth) throw new Error("The DOCX reader did not load. Try a PDF or text file.");
        const result = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
        text = result.value;
      } else if (extension === "pdf") {
        const pdfjsLib = await window.loadPdfJs();
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        const pages = [];
        for (let pageNumber = 1; pageNumber <= Math.min(pdf.numPages, 30); pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const content = await page.getTextContent();
          pages.push(content.items.map(item => item.str).join(" "));
        }
        text = pages.join("\n");
      } else {
        throw new Error("Use a PDF, DOCX, TXT, or Markdown project brief.");
      }

      const cleanText = text.replace(/\0/g, "").trim();
      if (!cleanText) throw new Error("No readable text found. Scanned PDFs need OCR before upload.");
      return cleanText.slice(0, 12000);
    };

      const updateMilestoneSchedule = async (form, milestone) => {

      const startTimelineDrag = (event, milestone, mode) => {
        if (event.button !== 0) return;
        const track = event.currentTarget.closest(".gantt-track");
        if (!track) return;
        const bounds = track.getBoundingClientRect();
        timelineDragRef.current = {
          pointerId: event.pointerId,
          milestone,
          mode,
          originX: event.clientX,
          trackWidth: bounds.width,
          timelineDuration: Math.max(1, ganttTimeline.duration),
          startDate: milestone.start_date,
          dueDate: milestone.due_date,
          preview: { start_date: milestone.start_date, due_date: milestone.due_date }
        };
        event.currentTarget.setPointerCapture(event.pointerId);
        event.preventDefault();
      };

      const handleTimelinePointerMove = event => {
        const drag = timelineDragRef.current;
        if (!drag || drag.pointerId !== event.pointerId || !drag.trackWidth) return;
        const dayDelta = Math.round((event.clientX - drag.originX) / drag.trackWidth * drag.timelineDuration);
        const toUtcDay = date => Date.parse(`${date}T00:00:00Z`);
        const fromUtcDay = timestamp => new Date(timestamp).toISOString().slice(0, 10);
        let start = toUtcDay(drag.startDate);
        let finish = toUtcDay(drag.dueDate);
        if (drag.mode === "move") {
          start += dayDelta * 86400000;
          finish += dayDelta * 86400000;
        } else if (drag.mode === "start") {
          start = Math.min(finish, start + dayDelta * 86400000);
        } else {
          finish = Math.max(start, finish + dayDelta * 86400000);
        }
        drag.preview = { start_date: fromUtcDay(start), due_date: fromUtcDay(finish) };
        setTimelinePreview({ id: drag.milestone.id, ...drag.preview });
      };

      const finishTimelineDrag = async event => {
        const drag = timelineDragRef.current;
        if (!drag || drag.pointerId !== event.pointerId) return;
        timelineDragRef.current = null;
        setTimelinePreview(null);
        if (drag.preview.start_date !== drag.startDate || drag.preview.due_date !== drag.dueDate) {
          await persistMilestoneUpdate(drag.milestone, drag.preview);
        }
      };

      const adjustTimelineBar = async (event, milestone) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const delta = event.key === "ArrowRight" ? 1 : -1;
        const dayMs = 86400000;
        const start = Date.parse(`${milestone.start_date}T00:00:00Z`);
        const finish = Date.parse(`${milestone.due_date}T00:00:00Z`);
        if (event.shiftKey) {
          const nextFinish = Math.max(start, finish + delta * dayMs);
          await persistMilestoneUpdate(milestone, { due_date: new Date(nextFinish).toISOString().slice(0, 10) });
        } else {
          await persistMilestoneUpdate(milestone, {
            start_date: new Date(start + delta * dayMs).toISOString().slice(0, 10),
            due_date: new Date(finish + delta * dayMs).toISOString().slice(0, 10)
          });
        }
      };

      const adjustTimelineHandle = async (event, milestone, mode) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        event.stopPropagation();
        const delta = event.key === "ArrowRight" ? 1 : -1;
        const dayMs = 86400000;
        const start = Date.parse(`${milestone.start_date}T00:00:00Z`);
        const finish = Date.parse(`${milestone.due_date}T00:00:00Z`);
        if (mode === "start") {
          await persistMilestoneUpdate(milestone, { start_date: new Date(Math.min(finish, start + delta * dayMs)).toISOString().slice(0, 10) });
        } else {
          await persistMilestoneUpdate(milestone, { due_date: new Date(Math.max(start, finish + delta * dayMs)).toISOString().slice(0, 10) });
        }
      };

      const updateMilestoneStatus = async (milestone, statusValue) => {
        const progress = statusValue === "done" ? 100 : statusValue === "not_started" ? 0 : Math.max(1, milestone.progress || 0);
        await persistMilestoneUpdate(milestone, { status: statusValue, progress });
      };

      const updateMilestoneProgress = async (milestone, value) => {
        const progress = Math.max(0, Math.min(100, Number(value)));
        const statusValue = progress === 100 ? "done" : progress === 0 ? "not_started" : "in_progress";
        await persistMilestoneUpdate(milestone, { progress, status: statusValue });
      };

      const updateMilestoneDependency = async (milestone, predecessorId) => {
        let currentId = predecessorId;
        const visited = new Set();
        while (currentId) {
          if (currentId === milestone.id || visited.has(currentId)) {
            setNotice("That dependency would create a cycle. Choose a different predecessor.");
            return;
          }
          visited.add(currentId);
          currentId = milestones.find(item => item.id === currentId)?.depends_on_id;
        }
        await persistMilestoneUpdate(milestone, { depends_on_id: predecessorId || null });
      };

      const toggleMilestoneRequirementLink = async (milestone, requirementId, checked) => {
        const currentLinks = milestone.linked_requirement_ids || [];
        const linkedRequirementIds = checked
          ? [...new Set([...currentLinks, requirementId])]
          : currentLinks.filter(id => id !== requirementId);
        await persistMilestoneUpdate(milestone, { linked_requirement_ids: linkedRequirementIds });
      };

      const exportProjectPlan = () => {
        const plan = {
          format: "tina-project-plan",
          version: 1,
          project: { title: activeProject?.title || "Project workspace" },
          exported_at: new Date().toISOString(),
          requirements: requirements.map(({ id, description, status, evidence }) => ({ id, description, status, evidence })),
          activities: milestones.map(({ id, title, details, start_date, due_date, status, progress, depends_on_id, linked_requirement_ids }) => ({
            id, title, details, start_date, due_date, status, progress: progress ?? 0,
            depends_on_id: depends_on_id || null, linked_requirement_ids: linked_requirement_ids || []
          }))
        };
        const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `${(activeProject?.title || "project-plan").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "project-plan"}.json`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setGanttExportNotice("Project plan JSON downloaded.");
      };

      const importProjectPlan = async event => {
        const file = event.target.files?.[0];
        if (!file) return;
        setGanttExportNotice("");
        try {
          const plan = JSON.parse(await file.text());
          if (plan.format !== "tina-project-plan" || plan.version !== 1 || !Array.isArray(plan.requirements) || !Array.isArray(plan.activities)) {
            throw new Error("Choose a Tina project plan JSON file (version 1).");
          }
          if (plan.requirements.length > 500 || plan.activities.length > 500) {
            throw new Error("A plan can contain up to 500 requirements and 500 activities.");
          }
          const importedRequirementIds = new Map();
          const importedActivityIds = new Map();
          const createImportId = () => demoMode ? createDemoId() : crypto.randomUUID();
          const isValidDate = value => {
            if (!value) return true;
            if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const parsed = new Date(`${value}T00:00:00Z`);
            return Number.isFinite(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value;
          };
          const importedRequirements = plan.requirements.map(requirement => {
            if (typeof requirement.description !== "string" || !requirement.description.trim() || requirement.description.length > 4000) {
              throw new Error("Every imported requirement needs a description under 4,000 characters.");
            }
            const id = createImportId();
            if (requirement.id != null) importedRequirementIds.set(String(requirement.id), id);
            return {
              id, project_id: activeProject.id, description: requirement.description.trim(),
              status: ["not_started", "in_progress", "done"].includes(requirement.status) ? requirement.status : "not_started",
              evidence: typeof requirement.evidence === "string" ? requirement.evidence : ""
            };
          });
          const sourceActivityIds = plan.activities.map(activity => String(activity.id));
          if (sourceActivityIds.some(id => !id || id === "undefined" || id === "null") || new Set(sourceActivityIds).size !== sourceActivityIds.length) {
            throw new Error("Each imported activity needs a unique ID.");
          }
          const activityIds = new Map(plan.activities.map(activity => [String(activity.id), createImportId()]));
          const importedActivities = plan.activities.map((activity, index) => {
            if (typeof activity.title !== "string" || !activity.title.trim() || activity.title.length > 200) {
              throw new Error("Every imported activity needs a title under 200 characters.");
            }
            const start = activity.start_date || null;
            const finish = activity.due_date || null;
            if (!isValidDate(start) || !isValidDate(finish) || (start && finish && start > finish) || Boolean(start) !== Boolean(finish)) {
              throw new Error(`Check the dates for “${activity.title}”. Add both dates or leave both blank.`);
            }
            const progress = Number.isFinite(Number(activity.progress)) ? Math.max(0, Math.min(100, Number(activity.progress))) : 0;
            const linkedRequirementIds = (Array.isArray(activity.linked_requirement_ids) ? activity.linked_requirement_ids : [])
              .map(id => importedRequirementIds.get(String(id))).filter(Boolean);
            return {
              id: activityIds.get(String(activity.id)), project_id: activeProject.id,
              title: activity.title.trim(), details: typeof activity.details === "string" ? activity.details : "",
              start_date: start, due_date: finish,
              status: ["not_started", "in_progress", "done"].includes(activity.status) ? activity.status : "not_started",
              progress, depends_on_id: activityIds.get(String(activity.depends_on_id)) || null,
              linked_requirement_ids: linkedRequirementIds, position: milestones.length + index
            };
          });
          const sourcePredecessors = new Map(plan.activities.map(activity => [String(activity.id), activity.depends_on_id == null ? null : String(activity.depends_on_id)]));
          for (const activity of plan.activities) {
            const seen = new Set([String(activity.id)]);
            let predecessorId = activity.depends_on_id == null ? null : String(activity.depends_on_id);
            while (predecessorId && sourcePredecessors.has(predecessorId)) {
              if (seen.has(predecessorId)) throw new Error("The imported activities contain a dependency cycle.");
              seen.add(predecessorId);
              predecessorId = sourcePredecessors.get(predecessorId);
            }
          }

          if (demoMode) {
            updateDemoWorkspace(workspace => {
              workspace.requirements.push(...importedRequirements.map(item => ({ ...item, created_at: new Date().toISOString(), updated_at: new Date().toISOString() })));
              workspace.milestones.push(...importedActivities.map(item => ({ ...item, created_at: new Date().toISOString(), updated_at: new Date().toISOString() })));
            });
          } else {
            if (importedRequirements.length) {
              const { error } = await supabase.from("project_requirements").insert(importedRequirements);
              if (error) throw new Error(error.message);
            }
            if (importedActivities.length) {
              const { error } = await supabase.from("project_milestones").insert(importedActivities);
              if (error) {
                if (importedRequirements.length) await supabase.from("project_requirements").delete().in("id", importedRequirements.map(item => item.id));
                throw new Error(error.message);
              }
            }
          }
          setRequirements(previous => [...previous, ...importedRequirements]);
          setMilestones(previous => [...previous, ...importedActivities]);
          setGanttExportNotice(`Imported ${importedActivities.length} activities and ${importedRequirements.length} requirements.`);
        } catch (error) {
          setGanttExportNotice(error instanceof Error ? error.message : "Could not import this project plan.");
        } finally {
          event.target.value = "";
        }
      };

      const updateGanttPreference = (key, value) => {
        setHoveredThemeId(null);
        setPinnedPreviewThemeId(null);
        setGanttPreferences(current => window.GanttTools.savePreferences({ ...current, [key]: value }));
      };

      const applyGanttTheme = themeId => {
        const theme = window.GanttTools.getTemplates(ganttPreferences)[themeId];
        if (!theme) return;
        setGanttPreferences(current => window.GanttTools.savePreferences({ ...current, template: themeId, color: theme.accent }));
        setHoveredThemeId(null);
        setPinnedPreviewThemeId(null);
      };

      const togglePinnedThemePreview = themeId => {
        setPinnedPreviewThemeId(current => current === themeId ? null : themeId);
      };

      const saveCustomGanttTheme = event => {
        event.preventDefault();
        try {
          const saved = window.GanttTools.saveCustomTheme(ganttPreferences, customThemeDraft);
          setGanttPreferences(saved);
          setHoveredThemeId(null);
          setPinnedPreviewThemeId(null);
          setCustomThemeOpen(false);
        } catch (error) {
          setGanttExportNotice(error instanceof Error ? error.message : "Could not save this theme.");
        }
      };

      const downloadGantt = async (format) => {
        setGanttExporting(true);
        setGanttExportNotice("");
        const options = {
          title: activeProject?.title || "Project timeline",
          template: ganttPreferences.template,
          color: ganttPreferences.color,
          customThemes: ganttPreferences.customThemes,
          locale: navigator.language
        };
        try {
          if (format === "png") {
            await window.GanttTools.downloadPng(milestones, options);
          } else {
            window.GanttTools.downloadSvg(milestones, options);
          }
          setGanttExportNotice(`Gantt ${format.toUpperCase()} downloaded.`);
        } catch (error) {
          setGanttExportNotice(error.message);
        } finally {
          setGanttExporting(false);
        }
      };

      const handleSend = async (event, promptOverride = "") => {
        event?.preventDefault();
        const userQuery = (promptOverride || input).trim();
        if (!userQuery || loading || !activeProject) return;
        setInput("");
        setLoading(true);
        setNotice("");
        setStatus("Saving your question...");

        try {
          let savedUserMessage;
          if (demoMode) {
            savedUserMessage = { id: createDemoId(), project_id: activeProject.id, role: "user", content: userQuery, created_at: new Date().toISOString() };
            updateDemoWorkspace(workspace => workspace.messages.push(savedUserMessage));
          } else {
            const { data, error } = await supabase.from("project_messages")
              .insert({ project_id: activeProject.id, role: "user", content: userQuery })
              .select().single();
            if (error) throw error;
            savedUserMessage = data;
          }

          const userMessage = { id: savedUserMessage.id, sender: "user", text: savedUserMessage.content };
          const history = [...messages, userMessage].slice(-10).map(message =>
            `${message.sender === "user" ? "<|im_start|>user" : "<|im_start|>assistant"}\n${message.text}\n<|im_end|>`
          ).join("\n");
          setMessages(previous => [...previous, userMessage]);

          const projectContext = [
            `Project: ${activeProject.title}`,
            `Summary: ${activeProject.summary || "Not provided."}`,
            `Technology stack: ${(activeProject.tech_stack || []).join(", ") || "Not provided."}`,
            `Requirements: ${requirements.map(item => `- [${item.status}] ${item.description}`).join("\n") || "None added yet."}`,
            `Milestones and timeline: ${milestones.map(item => `- [${item.status}] ${item.title}${item.start_date && item.due_date ? ` (${item.start_date} to ${item.due_date})` : item.due_date ? ` (finish ${item.due_date}; start date not set)` : ""}`).join("\n") || "None added yet."}`
          ].join("\n").slice(0, 10000);
          const prompt = [
            "<|im_start|>system",
            "You are Tina Build Coach, a patient project companion for a third-year BSIT student. Help the student understand and build their own project, break work into manageable steps, and prepare to explain their decisions. Use the supplied project context and conversation for continuity. Do not claim work is complete unless the student says so. If details are missing, ask a focused question. Keep technical advice clear and appropriately cautious.",
            `Student project context:\n${projectContext}`,
            "<|im_end|>",
            history,
            "<|im_start|>assistant"
          ].join("\n");

          setStatus("Tina is thinking...");
          const generate = await getPipeline();
          const output = await generate(prompt, {
            max_new_tokens: 384,
            temperature: 0.65,
            do_sample: true,
            return_full_text: false
          });
          const responseText = output[0].generated_text
            .replace(/<\|im_end\|>[\s\S]*$/, "")
            .trim();
          if (!responseText) throw new Error("Tina returned an empty reply. Try asking in a different way.");

          let savedAssistantMessage;
          if (demoMode) {
            savedAssistantMessage = { id: createDemoId(), project_id: activeProject.id, role: "assistant", content: responseText, created_at: new Date().toISOString() };
            updateDemoWorkspace(workspace => workspace.messages.push(savedAssistantMessage));
          } else {
            const { data, error } = await supabase.from("project_messages")
              .insert({ project_id: activeProject.id, role: "assistant", content: responseText })
              .select().single();
            if (error) throw error;
            savedAssistantMessage = data;
          }
          setMessages(previous => [...previous, {
            id: savedAssistantMessage.id,
            sender: "bot",
            text: savedAssistantMessage.content
          }]);
          setStatus("Ready");
        } catch (error) {
          console.error(error);
          setNotice(error.message);
          setStatus("Reply failed");
        } finally {
          setLoading(false);
        }
      };

      if (!user) {
        return (
          <main className="min-h-screen bg-slate-950 px-5 py-10 text-slate-100">
            <div className="mx-auto grid min-h-[calc(100vh-5rem)] max-w-5xl overflow-hidden rounded-lg border border-slate-800 bg-slate-900 md:grid-cols-[1.05fr_0.95fr]">
              <section className="flex flex-col justify-between bg-emerald-950 p-8 md:p-12">
                <div>
                  <p className="text-xs font-bold uppercase tracking-widest text-emerald-300">Tina / Student Project Studio</p>
                  <h1 className="mt-16 max-w-md text-4xl font-semibold leading-tight text-white">Build it. Understand it. Defend it.</h1>
                  <p className="mt-5 max-w-md text-sm leading-6 text-emerald-100">A project coach that keeps your requirements, milestones, and conversations together while you build.</p>
                </div>
                <p className="mt-16 text-xs text-emerald-300">Your project workspace is private to your account.</p>
              </section>
              <section className="flex items-center p-6 md:p-12">
                <form onSubmit={handleAuth} className="w-full space-y-5">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-widest text-emerald-400">{authMode === "sign_up" ? "Create your workspace" : "Welcome back"}</p>
                    <h2 className="mt-2 text-2xl font-semibold text-white">{authMode === "sign_up" ? "Create account" : "Sign in"}</h2>
                  </div>
                  <label className="block text-sm text-slate-300">Email
                    <input required type="email" autoComplete="email" value={authEmail} onChange={event => setAuthEmail(event.target.value)} className="mt-2 w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-3 text-white outline-none focus:border-emerald-500" />
                  </label>
                  <div className="block text-sm text-slate-300">
                    <label htmlFor="auth-password">Password</label>
                    <span className="relative mt-2 block">
                      <input id="auth-password" required type={showPassword ? "text" : "password"} minLength="6" autoComplete={authMode === "sign_up" ? "new-password" : "current-password"} value={authPassword} onChange={event => setAuthPassword(event.target.value)} className="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-3 pr-12 text-white outline-none focus:border-emerald-500" />
                      <button type="button" aria-label={showPassword ? "Hide password" : "Show password"} aria-pressed={showPassword} title={showPassword ? "Hide password" : "Show password"} onClick={() => setShowPassword(value => !value)} className="absolute inset-y-0 right-0 rounded-r-md px-3 text-slate-400 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-emerald-500">
                        <span aria-hidden="true">&#128065;&#65038;</span>
                      </button>
                    </span>
                  </div>
                  {authNotice && <p role="status" className="text-sm text-amber-300">{authNotice}</p>}
                  <button disabled={authBusy} className="w-full rounded-md bg-emerald-400 px-4 py-3 font-semibold text-slate-950 hover:bg-emerald-300 disabled:opacity-50">
                    {authBusy ? "Please wait..." : authMode === "sign_up" ? "Create account" : "Sign in"}
                  </button>
                  <div className="border-t border-slate-800 pt-4">
                    <button type="button" onClick={startDemo} className="w-full rounded-md border border-slate-600 px-4 py-3 text-sm font-semibold text-slate-100 hover:border-emerald-400 hover:text-emerald-300">Try the demo workspace</button>
                    <p className="mt-2 text-center text-xs text-slate-500">Sample project, no account needed. Demo edits stay in this browser.</p>
                  </div>
                  <p className="text-sm text-slate-400">
                    {authMode === "sign_up" ? "Already have an account?" : "New to Tina Build Coach?"}{" "}
                    <button type="button" onClick={() => { setAuthMode(authMode === "sign_up" ? "sign_in" : "sign_up"); setAuthNotice(""); }} className="font-medium text-emerald-300 hover:text-emerald-200">
                      {authMode === "sign_up" ? "Sign in" : "Create one"}
                    </button>
                  </p>
                </form>
              </section>
            </div>
          </main>
        );
      }

      const StatusSelect = ({ value, onChange }) => (
        <select value={value} onChange={event => onChange(event.target.value)} className={`gantt-status-select status-${value}`}>
          <option value="not_started">Not started</option>
          <option value="in_progress">In progress</option>
          <option value="done">Completed</option>
        </select>
      );

      const timelineMilestones = milestones.map(item => timelinePreview?.id === item.id ? { ...item, ...timelinePreview } : item);
      const ganttTimeline = window.GanttTools.buildTimeline(timelineMilestones);
      const scheduledMilestones = ganttTimeline.activities;
      const timelineTicks = ganttTimeline.ticks;
      const criticalActivityIds = new Set(window.GanttTools.calculateCriticalPath(scheduledMilestones));
      const scheduledCriticalCount = scheduledMilestones.filter(item => criticalActivityIds.has(String(item.id))).length;
      const availableGanttThemes = window.GanttTools.getTemplates(ganttPreferences);
      const activeGanttTheme = availableGanttThemes[ganttPreferences.template] || availableGanttThemes.meadow;
      const previewThemeId = hoveredThemeId || pinnedPreviewThemeId;
      const isThemePreviewing = Boolean(previewThemeId && previewThemeId !== ganttPreferences.template && availableGanttThemes[previewThemeId]);
      const displayedGanttTheme = isThemePreviewing ? availableGanttThemes[previewThemeId] : activeGanttTheme;
      const displayedGanttAccent = isThemePreviewing ? displayedGanttTheme.accent : ganttPreferences.color;
      const themeCategories = [
        ["all", "All"], ["dark", "Dark themes"], ["academic", "Academic"],
        ["agile", "Agile / sprint"], ["high-contrast", "High contrast"], ["custom", "Custom"]
      ];
      const visibleGanttThemes = Object.entries(availableGanttThemes).filter(([, theme]) =>
        themeFilter === "all" || theme.categories.includes(themeFilter)
      );
      const formatPlanDate = date => window.GanttTools.formatDate(date, navigator.language);
      const assistantMarkdown = content => {
        const source = String(content || "");
        if (window.marked?.parse && window.DOMPurify?.sanitize) {
          const parsed = window.marked.parse(source, { gfm: true, breaks: true });
          return { __html: window.DOMPurify.sanitize(parsed, { USE_PROFILES: { html: true } }) };
        }
        const escaped = source.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
        return { __html: escaped.replace(/\n/g, "<br>") };
      };

      return (
        <div className="app-shell flex h-dvh min-h-0 overflow-hidden bg-slate-950 text-slate-100">
          <div className={`sidebar-dock${sidebarOpen ? " is-open" : ""}`} onMouseEnter={() => setSidebarOpen(true)} onMouseLeave={() => setSidebarOpen(false)} onFocusCapture={() => setSidebarOpen(true)} onBlurCapture={event => { if (!event.currentTarget.contains(event.relatedTarget)) setSidebarOpen(false); }}>
            <aside className="sidebar-panel flex flex-col border-r border-slate-800 bg-slate-900">
              <div className="sidebar-brand">
                <button type="button" className="sidebar-brand-mark" aria-label="Open Tina sidebar" aria-expanded={sidebarOpen} title="Tina Build Coach" onClick={() => setSidebarOpen(true)}>T</button>
                <div className="sidebar-collapsible min-w-0">
                  <p className="truncate text-xs font-bold uppercase tracking-widest text-emerald-400">Tina / Build Coach</p>
                  <p className="mt-1 truncate text-xs text-slate-500">{demoMode ? "Demo workspace · local only" : "Student Project Studio"}</p>
                </div>
              </div>
              <div className="sidebar-collapsible">

                  <span className="text-xs font-semibold uppercase tracking-wide text-slate-500">Recent projects</span>
                  <button type="button" onClick={() => { setActiveProject(null); setNotice(""); setSidebarOpen(false); }} className="rounded border border-slate-700 px-2 py-1 text-xs text-emerald-300 hover:border-emerald-500">+ New</button>

                      <span aria-hidden="true" className="project-list-icon"><span className="project-list-glyph">▦</span></span>
                      <span className="project-list-copy"><span className="project-list-title">{project.title}</span><span className="project-list-stack">{project.tech_stack?.join(", ") || "Project workspace"}</span></span>

                  {!projects.length && <p className="px-3 py-3 text-xs leading-5 text-slate-500">No recent projects.</p>}

              </div>
              {activeProject && <nav aria-label="Project sections" className="sidebar-section-nav sidebar-collapsible space-y-1">

                  <button key={section} type="button" aria-current={activeSection === section ? "page" : undefined} onClick={() => navigateToSection(section)} className="sidebar-section-link">
                    <span aria-hidden="true" className="sidebar-section-icon">{icon}</span>

                    {section === "plan" && <span className="rounded-full bg-slate-800 px-1.5 py-0.5 text-[10px]">{requirements.length + milestones.length}</span>}
                  </button>

              <div className="sidebar-collapsible mt-auto border-t border-slate-800 p-4">
                <p className="truncate text-xs text-slate-400">{user.email}</p>

              </div>
            </aside>
          </div>

          <main className="flex min-h-0 min-w-0 flex-1 flex-col">
            {activeSection !== "coach" && <header className="flex min-h-16 items-center justify-between gap-3 border-b border-slate-800 bg-slate-900 px-4 py-3 md:px-6">
              <div className="min-w-0">
                <p className="text-[10px] font-bold uppercase tracking-widest text-emerald-700">Tina / Build Coach</p>
                <div className="mt-0.5 flex min-w-0 items-center gap-2"><h1 className="truncate text-base font-semibold text-slate-950 md:text-lg" style={{ color: "var(--ink)" }}>{activeProject?.title || "Project workspace"}</h1>
                  {demoMode && demoNoticeVisible && <span title="Changes are saved only in this browser and do not affect Supabase." className="inline-flex shrink-0 items-center gap-1 rounded-full border border-sky-700/30 bg-sky-100 px-2 py-0.5 text-[10px] font-medium text-sky-900"><span>Demo</span><button type="button" aria-label="Dismiss demo notice" onClick={() => setDemoNoticeVisible(false)} className="ml-0.5 leading-none">×</button></span>}
                </div>
              </div>
              <span className="hidden text-xs text-slate-400 sm:inline">{status}</span>
            </header>}

            {activeSection !== "coach" && notice && <div role="alert" className="border-b border-amber-900 bg-amber-950/60 px-4 py-2 text-sm text-amber-200">{notice}</div>}

            {!activeProject ? (

                </section>}

                {activeSection === "coach" && <section className={`tina-coach flex h-full min-h-0 flex-col ${typeof document.startViewTransition === "function" ? "" : "tina-focus-enter"}`}>
                  <header className="tina-chat-header"><div className="tina-chat-header-inner"><button type="button" onClick={() => navigateToSection("overview")} aria-label="Back to project overview" title="Back to project overview" className="tina-back-button garden-sweep flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-slate-700 bg-slate-900 text-lg text-slate-300"><span className="garden-icon-glyph" aria-hidden="true">&#8592;</span></button><div className="min-w-0"><p className="tina-chat-eyebrow">Project conversation</p><h2 className="tina-chat-project-title">{activeProject.title}</h2></div></div></header>
                  {notice && <div role="alert" className="border-b border-amber-900 bg-amber-950/60 px-5 py-2 text-sm text-amber-200">{notice}</div>}
                  <div className="tina-message-stream" role="log" aria-label="Conversation messages" aria-live="polite" aria-relevant="additions text"><div className="tina-message-list">
                    {!messages.length && <div className="tina-chat-empty"><p className="text-sm font-semibold text-white">{activeProject.summary ? "Your Project Twin is ready to build." : "Start with your next decision."}</p><p className="mt-2 text-sm leading-5 text-slate-400">{activeProject.summary ? "Tina can map the brief into goals, requirements, risks, and the one thing you should clarify next." : "Tell Tina what you are building in your own words. No setup checklist required."}</p>{activeProject.summary && <button onClick={() => handleSend(null, "Read my saved project brief and create my Project Twin. Summarize the goal, target users, stated requirements, technologies, risks, and assumptions. Separate facts from guesses, then ask only the single most important question the brief leaves unanswered.")} className="tina-send-button mt-4">Analyze my brief</button>}</div>}
                    {messages.map((message, index) => {
                      const isUser = message.sender === "user";
                      return <article key={message.id || index} className={`tina-message-row ${isUser ? "is-user" : "is-assistant"}`}>
                        <span className="tina-message-avatar" aria-hidden="true">{isUser ? "Y" : "T"}</span>
                        <div className="tina-message-bubble"><p className="tina-message-author">{isUser ? "You" : "Tina"}</p>{isUser ? <div className="tina-message-copy">{message.text}</div> : <div className="tina-markdown" dangerouslySetInnerHTML={assistantMarkdown(message.text)} />}</div>
                      </article>;
                    })}
                    {loading && <article className="tina-message-row is-assistant"><span className="tina-message-avatar" aria-hidden="true">T</span><div className="tina-message-bubble"><p className="tina-message-author">Tina</p><p className="tina-message-copy">Thinking through your project...</p></div></article>}
                    <div ref={chatEndRef} />
                  </div></div>
                  <form onSubmit={handleSend} className="tina-composer">
                    <div className="tina-composer-inner">
                      <details className="tina-suggestions">
                        <summary><span className="tina-suggestions-spark" aria-hidden="true">✦</span><span>Suggestions</span><span className="tina-suggestions-chevron" aria-hidden="true">⌄</span></summary>
                        <div className="tina-suggestions-list">
                          {[["Next step", "What should I build next for this project?"], ["Spot risks", "What are the biggest risks or unknowns in this project?"], ["Practice defense", "Ask me one mock project defense question."]].map(([label, prompt]) => <button key={label} type="button" disabled={loading} onClick={event => { event.currentTarget.closest("details").open = false; handleSend(event, prompt); }} className="tina-prompt-button">{label}</button>)}
                        </div>
                      </details>
                      <div className="tina-composer-row">
                        <textarea ref={chatInputRef} rows="1" value={input} onChange={event => setInput(event.target.value)} onKeyDown={event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); event.currentTarget.form.requestSubmit(); } }} placeholder="Ask about your project, requirements, or next step..." aria-label="Message Tina" className="tina-composer-textarea" />
                        <button type="submit" disabled={loading || !input.trim()} className="tina-send-button"><span aria-hidden="true">➤</span><span>Send to Tina</span></button>
                      </div>
                      <div className="tina-composer-meta"><span className="text-xs text-slate-500">Enter to send, Shift+Enter for a new line</span></div>
                    </div>
                  </form>
                </section>}
              </div>
            )}
          </main>
          {customThemeOpen && <div className="gantt-custom-overlay" onMouseDown={event => { if (event.target === event.currentTarget) setCustomThemeOpen(false); }}>
            <form role="dialog" aria-modal="true" aria-labelledby="custom-theme-title" className="gantt-custom-dialog" onSubmit={saveCustomGanttTheme} onKeyDown={event => { if (event.key === "Escape") setCustomThemeOpen(false); }}>
              <div className="flex items-start justify-between gap-4"><div><p className="text-xs font-bold uppercase tracking-widest text-emerald-700">Theme designer</p><h2 id="custom-theme-title" className="mt-1 text-xl font-semibold">Create custom theme</h2><p className="mt-1 text-sm text-slate-600">Set the palette and chart treatment for this browser.</p></div><button type="button" aria-label="Close theme designer" title="Close theme designer" onClick={() => setCustomThemeOpen(false)} className="grid h-8 w-8 shrink-0 place-items-center rounded border border-slate-300 text-lg text-slate-700">×</button></div>
              <div className="gantt-custom-grid mt-5">
                <label className="gantt-custom-field">Theme name<input required maxLength="32" value={customThemeDraft.label} onChange={event => setCustomThemeDraft(current => ({ ...current, label: event.target.value }))} /></label>
                <label className="gantt-custom-field">Short description<input maxLength="100" value={customThemeDraft.description} onChange={event => setCustomThemeDraft(current => ({ ...current, description: event.target.value }))} /></label>
                <label className="gantt-custom-field">Layout<select value={customThemeDraft.layout} onChange={event => setCustomThemeDraft(current => ({ ...current, layout: event.target.value }))}><option value="gantt">Horizontal Gantt</option><option value="schedule">Compact schedule</option><option value="roadmap">Vertical roadmap</option></select></label>
                <label className="gantt-custom-field">Typography<select value={customThemeDraft.fontFace} onChange={event => setCustomThemeDraft(current => ({ ...current, fontFace: event.target.value }))}><option value="sans">Clean sans-serif</option><option value="serif">Editorial serif</option><option value="mono">Developer monospace</option></select></label>
                <label className="gantt-custom-field">Bar style<select value={customThemeDraft.barStyle} onChange={event => setCustomThemeDraft(current => ({ ...current, barStyle: event.target.value }))}><option value="rounded">Rounded</option><option value="square">Square corners</option><option value="outlined">Outlined</option><option value="striped">Striped progress</option><option value="wireframe">Wireframe</option></select></label>
                {[["surface", "Canvas"], ["track", "Task track"], ["grid", "Gridlines"], ["ink", "Text"], ["muted", "Secondary text"], ["accent", "Accent / bars"]].map(([key, label]) => <label key={key} className="gantt-custom-field">{label}<input type="color" value={customThemeDraft[key]} onChange={event => setCustomThemeDraft(current => ({ ...current, [key]: event.target.value }))} /></label>)}
              </div>
              <div className="gantt-theme-preview mt-4" aria-label="Custom theme preview" style={{ "--theme-surface": customThemeDraft.surface, "--theme-track": customThemeDraft.track, "--theme-grid": customThemeDraft.grid, "--theme-muted": customThemeDraft.muted, "--theme-accent": customThemeDraft.accent, "--theme-radius": customThemeDraft.barStyle === "rounded" ? "9px" : "2px" }}>
                {[25, 48, 16].map((left, index) => <div key={index} className="gantt-theme-preview-row"><span className="gantt-theme-preview-label" /><span className="gantt-theme-preview-track"><span className="gantt-theme-preview-bar" style={{ left: `${left}%`, width: "36%" }} /></span></div>)}
              </div>
              <div className="mt-5 flex justify-end gap-2"><button type="button" onClick={() => setCustomThemeOpen(false)} className="rounded border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700">Cancel</button><button type="submit" className="rounded bg-emerald-700 px-3 py-2 text-sm font-semibold text-white">Save and apply</button></div>
            </form>
          </div>}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
